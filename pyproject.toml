[project]
name = "tem-reimplementation"
version = "0.1.0"
description = "A simple PyTorch reimplementation of the Tolman-Eichenbaum Machine."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
